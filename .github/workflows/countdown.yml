name: Update countdown
on:
  schedule:
    - cron: "5 17 * * *"   # 00:05 เวลาไทย (UTC+7)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Calculate days left
        run: |
          TODAY=$(TZ=Asia/Bangkok date +%Y-%m-%d)
          YEAR=$(TZ=Asia/Bangkok date +%Y)
          END="$YEAR-12-31"
          DAYS=$(( ($(date -d "$END" +%s) - $(date -d "$TODAY" +%s)) / 86400 ))

          # Full formatted date: e.g. Friday, 21 August 2026
          FULL_DATE=$(TZ=Asia/Bangkok date +"%A, %d %B %Y")

          TEXT="📅 Today is **$FULL_DATE**  
          ⏳ **$DAYS days** left until the end of $YEAR"

          python3 - "$TEXT" <<'EOF'
          import re, sys
          text = sys.argv[1]
          p = "README.md"
          s = open(p, encoding="utf-8").read()
          s = re.sub(r"(<!--START:countdown-->).*?(<!--END:countdown-->)",
                     f"\\1\n{text}\n\\2", s, flags=re.S)
          open(p, "w", encoding="utf-8").write(s)
          EOF

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: update countdown" || exit 0
          git push
